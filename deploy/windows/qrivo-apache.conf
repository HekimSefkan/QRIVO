# ════════════════════════════════════════════════════════════════════════════
#  QRIVO — standalone Apache configuration (Windows)
#
#  WHY THIS EXISTS
#  PHP's built-in server (`php -S`) handles exactly ONE request at a time, and
#  on Windows it cannot do better: PHP_CLI_SERVER_WORKERS relies on fork(),
#  and pcntl is unavailable here. With the teacher panel polling the live
#  roster every ~3 s and refreshing the QR, a phone's request queues behind
#  that traffic and can exceed the app's 20 s timeout, surfacing as
#  "Could not reach the server".
#
#  Apache's mpm_winnt is threaded, and this PHP is a ZTS (thread-safe) build,
#  so mod_php serves requests genuinely concurrently.
#
#  This file is SELF-CONTAINED. It does not include Laragon's httpd.conf and
#  does not disturb Laragon's own Apache setup. Start it with:
#      httpd.exe -f C:/Projects/QRIVO/deploy/windows/qrivo-apache.conf
#  (start-qrivo.ps1 does this for you.)
# ════════════════════════════════════════════════════════════════════════════

ServerRoot "C:/laragon/bin/apache/httpd-2.4.68-260617-Win64-VS18"
ServerName qrivo.local
PidFile    "C:/Projects/QRIVO/deploy/windows/run/httpd.pid"

# ── Ports ───────────────────────────────────────────────────────────────────
#  8000 = the API          (Tailscale Funnel proxies "/"      here)
#  8080 = the teacher panel (Tailscale Funnel proxies "/panel" here)
#  Bound to 0.0.0.0 so the LAN and the Funnel can both reach them.
Listen 8000
Listen 8080

# ── Modules ─────────────────────────────────────────────────────────────────
LoadModule authz_core_module   modules/mod_authz_core.so
LoadModule mime_module         modules/mod_mime.so
LoadModule dir_module          modules/mod_dir.so
LoadModule log_config_module   modules/mod_log_config.so
LoadModule setenvif_module     modules/mod_setenvif.so
LoadModule headers_module      modules/mod_headers.so
LoadModule rewrite_module      modules/mod_rewrite.so
LoadModule alias_module        modules/mod_alias.so

# mod_php — requires the ZTS build of PHP, which is what Laragon ships.
LoadModule php_module "C:/laragon/bin/php/php-8.3.33-Win32-vs16-x64/php8apache2_4.dll"
PHPIniDir             "C:/laragon/bin/php/php-8.3.33-Win32-vs16-x64"
AddHandler application/x-httpd-php .php

# ── Concurrency (mpm_winnt) ─────────────────────────────────────────────────
# One child process, many worker threads. 150 is far more than a jury demo
# needs; the point is that it is not 1.
<IfModule mpm_winnt_module>
    ThreadsPerChild      150
    MaxConnectionsPerChild 0
</IfModule>

TypesConfig conf/mime.types
DefaultRuntimeDir "C:/Projects/QRIVO/deploy/windows/run"

LogLevel warn
ErrorLog "C:/Projects/QRIVO/deploy/windows/logs/apache-error.log"
LogFormat "%h %l %u %t \"%r\" %>s %b %D" qrivo
CustomLog "C:/Projects/QRIVO/deploy/windows/logs/apache-access.log" qrivo

# Never advertise the version.
ServerTokens Prod
ServerSignature Off

# Deny everything by default; each vhost opens only what it needs.
<Directory />
    AllowOverride None
    Require all denied
</Directory>

# ════════════════════════════════════════════════════════════════════════════
#  API  — http://0.0.0.0:8000   document root = backend/public
# ════════════════════════════════════════════════════════════════════════════
<VirtualHost *:8000>
    ServerName qrivo-api
    DocumentRoot "C:/Projects/QRIVO/backend/public"

    <Directory "C:/Projects/QRIVO/backend/public">
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        Options -Indexes +FollowSymLinks

        # Front controller. Every /api/v1/* path is a route, not a file, so
        # anything that is not a real file or directory goes to index.php.
        # REQUEST_URI is preserved, which is what Request::fromGlobals() reads.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [QSA,L]
    </Directory>

    # Only index.php is ever executed. Nothing else lives in public/, and if
    # anything ever lands there it must not become an entry point.
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>

    # The Authorization header must reach PHP. Apache does forward it to
    # mod_php, but this makes the requirement explicit and survives a switch to
    # FastCGI later.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    # ── Teacher panel under /panel on THIS vhost ────────────────────────────
    # So a single public tunnel (which maps one port) serves both the API at /
    # and the panel at /panel. The standalone :8080 vhost below stays for local
    # use. Static only - PHP is never executed from the web/ directory.
    Alias /panel "C:/Projects/QRIVO/web"
    <Directory "C:/Projects/QRIVO/web">
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        Options -Indexes +FollowSymLinks
        php_admin_flag engine off
    </Directory>
</VirtualHost>

# ════════════════════════════════════════════════════════════════════════════
#  Teacher panel — http://0.0.0.0:8080   document root = web/
#  Static files only; no PHP is executed here.
# ════════════════════════════════════════════════════════════════════════════
<VirtualHost *:8080>
    ServerName qrivo-panel
    DocumentRoot "C:/Projects/QRIVO/web"

    <Directory "C:/Projects/QRIVO/web">
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
        Options -Indexes +FollowSymLinks
    </Directory>

    # This vhost serves a static client. Executing PHP here would be a bug.
    php_admin_flag engine off
</VirtualHost>

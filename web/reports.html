<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QRIVO — Raporlar</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand navbar-brand-mark text-primary" href="dashboard.html">QRIVO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
            aria-controls="nav" aria-expanded="false" aria-label="Menüyü aç/kapat">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="dashboard.html">Panel</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="reports.html">Raporlar</a></li>
      </ul>
      <div class="d-flex align-items-center gap-3">
        <div class="text-end small">
          <div class="fw-semibold" id="navUserName">—</div>
          <div class="text-body-secondary" id="navUserRole"></div>
        </div>
        <button class="btn btn-outline-secondary btn-sm" id="logoutBtn">Çıkış</button>
      </div>
    </div>
  </div>
</nav>

<main class="container-fluid py-4">
  <h1 class="h5 mb-3">Yoklama Raporları</h1>

  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-12 col-md-3">
          <label for="reportType" class="form-label">Rapor türü</label>
          <select class="form-select" id="reportType">
            <option value="course">Ders raporu</option>
            <option value="class">Sınıf raporu</option>
            <option value="student">Öğrenci raporu</option>
          </select>
        </div>

        <div class="col-12 col-md-4">
          <label for="targetSelect" class="form-label" id="targetLabel">Ders</label>
          <select class="form-select" id="targetSelect"></select>
          <div class="form-text" id="targetHelp">Yalnızca size atanmış dersler listelenir.</div>
        </div>

        <div class="col-6 col-md-2">
          <label for="fromDate" class="form-label">Başlangıç</label>
          <input type="date" class="form-control" id="fromDate">
        </div>
        <div class="col-6 col-md-2">
          <label for="toDate" class="form-label">Bitiş</label>
          <input type="date" class="form-control" id="toDate">
        </div>

        <div class="col-12 col-md-1 d-grid">
          <button class="btn btn-primary" id="runBtn">Getir</button>
        </div>
      </div>

      <div class="mt-3 d-none" id="studentNumberWrap">
        <label for="studentSelect" class="form-label">Öğrenci</label>
        <select class="form-select" id="studentSelect"></select>
        <div class="form-text">Öğrenci listesi, seçtiğiniz dersin son yoklamasından alınır.</div>
      </div>
    </div>
  </div>

  <div id="reportError" class="alert alert-danger d-none" role="alert"></div>

  <section id="reportResult" class="d-none">
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h6 mb-3">Özet</h2>
        <div class="counter-grid" id="summaryGrid"></div>
        <p class="text-body-secondary small mb-0 mt-3" id="summaryLine"></p>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body pb-0">
        <h2 class="h6 mb-0" id="detailTitle">Ayrıntı</h2>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light"><tr id="detailHead"></tr></thead>
          <tbody id="detailBody"></tbody>
        </table>
      </div>
      <div class="card-body d-flex justify-content-between align-items-center" id="pagerWrap" hidden>
        <span class="small text-body-secondary" id="pagerInfo"></span>
        <div class="btn-group btn-group-sm">
          <button class="btn btn-outline-secondary" id="prevPage">Önceki</button>
          <button class="btn btn-outline-secondary" id="nextPage">Sonraki</button>
        </div>
      </div>
    </div>
  </section>
</main>

<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" data-confirm-title>Onay</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        <p data-confirm-body class="mb-0"></p>
        <div class="mt-3 d-none" data-confirm-reason-wrap>
          <input type="text" class="form-control" data-confirm-reason maxlength="500">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Vazgeç</button>
        <button type="button" class="btn btn-primary" data-confirm-ok>Onayla</button>
      </div>
    </div>
  </div>
</div>

<div id="toastHost" aria-live="polite" aria-atomic="true"></div>

<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/reports.js"></script>
</body>
</html>
